spec:
  gcp:
    sqlInstances:
      - name: pale-2-register-instance
        type: POSTGRES_16
        diskSize: 10
        databases:
          - name: pale-2-register
            envVarPrefix: DB
            users:
              - name: macgyver
        diskAutoresize: true
        highAvailability: false
        diskType: SSD
        insights:
          enabled: true
        flags:
          - name: cloudsql.logical_decoding
            value: "on"
        tier: db-f1-micro
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 90
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 30m
      memory: 600Mi
  filesFrom:
    - secret: pale2-google-creds
  kafka:
    pool: nav-dev
