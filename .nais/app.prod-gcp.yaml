spec:
  gcp:
    sqlInstances:
      - name: pale-2-register-instance
        type: POSTGRES_16
        diskSize: 75
        databases:
          - name: pale-2-register
            envVarPrefix: DB
            users:
              - name: macgyver
        diskAutoresize: true
        highAvailability: false
        diskType: SSD
        insights:
          enabled: true
        flags:
          - name: cloudsql.logical_decoding
            value: "on"
        tier: db-custom-1-3840
  replicas:
    min: 2
    max: 4
    scalingStrategy:
      cpu:
        thresholdPercentage: 90
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 650Mi
  filesFrom:
    - secret: pale2-google-creds
  kafka:
    pool: nav-prod
